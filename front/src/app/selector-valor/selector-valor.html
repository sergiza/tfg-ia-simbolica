@if (creando()) {
  <span class="inline-flex items-center gap-2">
    <input
      [value]="nombreNuevo()"
      (input)="actualizarNombre($event)"
      placeholder="nueva constante"
      autocomplete="off"
      aria-label="Nombre de la nueva constante"
      class="w-40 rounded border border-indigo-400 bg-white px-2 py-1.5 font-mono text-sm focus:border-indigo-600 focus:outline-none"
    />
    <button
      type="button"
      (click)="crear()"
      [disabled]="!nombreValido()"
      class="rounded bg-indigo-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-slate-300"
    >
      Crear
    </button>
    <button
      type="button"
      (click)="cancelar()"
      class="rounded px-2 py-1.5 text-xs text-slate-500 hover:text-slate-700"
    >
      Cancelar
    </button>
  </span>
} @else {
  <select (change)="elegir($event)" [attr.aria-label]="etiqueta()" [class]="estiloSelect()">
    <option value="" disabled [selected]="valor() === ''">elige…</option>
    @if (variables() !== null) {
      <optgroup label="Variables">
        @for (v of variables()!; track v) {
          <option [value]="v" [selected]="v === valor()">{{ v }}</option>
        }
        @if (nuevaVariable()) {
          <option [value]="nuevaVariable()!" [selected]="nuevaVariable() === valor()">
            {{ nuevaVariable() }} · nueva
          </option>
        }
      </optgroup>
      <optgroup label="Constantes">
        @for (t of kb.terminos(); track t) {
          <option [value]="t" [selected]="t === valor()">{{ t }}</option>
        }
        <option value="__nueva__">+ nueva constante…</option>
      </optgroup>
    } @else {
      @for (t of kb.terminos(); track t) {
        <option [value]="t" [selected]="t === valor()">{{ t }}</option>
      }
      <option value="__nueva__">+ nueva constante…</option>
    }
  </select>
}
