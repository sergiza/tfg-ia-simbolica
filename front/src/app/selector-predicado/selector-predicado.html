@if (creando()) {
  <span class="inline-flex flex-wrap items-center gap-2">
    <input
      [value]="nombreNuevo()"
      (input)="actualizarNombre($event)"
      placeholder="nuevo predicado"
      autocomplete="off"
      aria-label="Nombre del nuevo predicado"
      class="w-44 rounded border border-indigo-400 bg-white px-2 py-1.5 font-mono text-sm focus:border-indigo-600 focus:outline-none"
    />
    <label class="inline-flex items-center gap-1 text-xs text-slate-500">
      términos:
      <select
        [value]="aridadNueva()"
        (change)="actualizarAridad($event)"
        aria-label="Número de términos"
        class="rounded border border-slate-300 bg-white px-2 py-1.5 text-sm focus:border-indigo-500 focus:outline-none"
      >
        <option [value]="1" [selected]="aridadNueva() === 1">1</option>
        <option [value]="2" [selected]="aridadNueva() === 2">2</option>
        <option [value]="3" [selected]="aridadNueva() === 3">3</option>
      </select>
    </label>
    <button
      type="button"
      (click)="crear()"
      [disabled]="!nombreValido()"
      class="rounded bg-indigo-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-indigo-500 disabled:cursor-not-allowed disabled:bg-slate-300"
    >
      Crear
    </button>
    <button
      type="button"
      (click)="cancelar()"
      class="rounded px-2 py-1.5 text-xs text-slate-500 hover:text-slate-700"
    >
      Cancelar
    </button>
  </span>
} @else {
  <app-combobox
    [valor]="valor()"
    [grupos]="grupos()"
    [etiqueta]="etiqueta()"
    [estilo]="estiloEntrada"
    marcador="predicado…"
    textoCrear="nuevo predicado"
    ancho="w-44"
    (cambio)="elegir($event)"
    (crear)="pedirCrear($event)"
  />
}
