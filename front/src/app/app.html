<div class="flex h-dvh flex-col bg-slate-100 text-slate-900">
  <header class="flex items-center gap-6 border-b border-slate-300 bg-white px-6">
    <h1 class="text-base font-bold">DatalogVisual</h1>

    <nav class="flex">
      <a
        routerLink="/"
        routerLinkActive
        #home="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [class]="home.isActive ? enlaceActivo : enlaceInactivo"
      >
        Inicio
      </a>
      <a
        routerLink="/pydatalog"
        routerLinkActive
        #editor="routerLinkActive"
        [class]="editor.isActive ? enlaceActivo : enlaceInactivo"
        >Editor</a
      >
      <a
        routerLink="/biblioteca"
        routerLinkActive
        #biblioteca="routerLinkActive"
        [class]="biblioteca.isActive ? enlaceActivo : enlaceInactivo"
        >Biblioteca</a
      >
    </nav>
  </header>

  <router-outlet />
</div>
